name: Bug report / Ошибка
description: Report a reproducible problem with Christmas Lights
labels: [bug]
body:
  - type: dropdown
    id: version
    attributes:
      label: App version / Версия
      options:
        - v1.0.0
        - v1.3 release candidate
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows build and architecture
      placeholder: Windows 11 x64 (23H2)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce / Как повторить
      description: Mention bulb shape, lighting mode, audio mode and monitor/DPI if relevant.
      placeholder: |
        1. Start ...
        2. Open ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked attachments and logs for personal or sensitive information.
          required: true
